---
# Add a description of the workflow here

name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Hello
        run: echo "Hello from GitHub Actions!"

      - name: Bash version
        run: bash --version

      - name: Python version
        run: python --version

      - name: Create build.txt
        run: |
          echo "Build successful on Python ${{ matrix.python-version }}" \
            > build.txt

      - name: Check that build.txt exists
        run: test -f build.txt && echo "build.txt exists"

      - name: Show build.txt content
        run: cat build.txt

      - name: Upload build.txt
        uses: actions/upload-artifact@v4
        with:
          name: build-file-${{ matrix.python-version }}
          path: build.txt

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Build started
        run: echo "Test passed, starting build!"

      - name: Download all build files
        uses: actions/download-artifact@v4
        with:
          pattern: build-file-*

      - name: Show downloaded files
        run: |
          ls -R
          cat build-file-3.10/build.txt
          cat build-file-3.11/build.txt
          cat build-file-3.12/build.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml
      - run: pip install pre-commit
      - run: pre-commit run --all-files
